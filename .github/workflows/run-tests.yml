name: JUnit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven

      - name: Run and Verify Tests
        run: |
          set -o pipefail
          mvn -B test | tee test-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ Unit tests failed with exit code $exit_code."
            exit $exit_code
          fi

          # Surefire prints a final summary line like "Tests run: 20, Failures: 0, ..."
          TEST_COUNT=$(grep -oP 'Tests run: \K\d+' test-results.txt | tail -n 1)
          MIN_TESTS=15

          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "❌ Only $TEST_COUNT tests were run. At least $MIN_TESTS tests are required. Please write more unit tests"
            exit 1
          fi

          echo "✅ All unit tests passed and $TEST_COUNT tests were executed."
